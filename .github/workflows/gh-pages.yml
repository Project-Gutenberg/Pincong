name: github pages


on:
 schedule:
  - cron: "0 18 */8 * *"
 push:
   branches:
   - main
permissions:
  contents: write

concurrency:
  group: gh-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: [ubicloud-standard-16] #self-hosted
    outputs:
      artifact-name: ${{ steps.upload-artifact.outputs.artifact-name }}
    steps:
    - name: Init
      run: |
          echo "::add-mask::${{ secrets.PATH_HFFIN }}"
          echo "::add-mask::${{ secrets.PATH_HFEEF }}"
          echo "::add-mask::${{ secrets.PATH_HFFIE }}"
          echo "::add-mask::${{ secrets.PATH_FEDGE }}"
          echo "::add-mask::${{ secrets.MACHINE }}"

    - uses: actions/checkout@v4
      with:
        repository: Project-Gutenberg/Pincong-data

    # 仅用于诊断：查看当前 repo 的对象库大小（包含 size-pack）
    - name: Log git object store size
      shell: bash
      run: |
        echo "==== git count-objects -Hv ===="
        git count-objects -Hv
        echo "==== size-pack only ===="
        git count-objects -Hv | sed -n 's/^size-pack: //p'

    - name: Process tags
      run: chmod +x ./main && ./main tag

    - name: Setup Hugo
      uses: peaceiris/actions-hugo@v2
      with:
        hugo-version: '0.100.2'
        extended: true

    - name: Build Hogo
      run: hugo --minify --config github.toml,base.toml -d ../public -s site

    - name: Split Sitemap
      run: ./main sitemap ./public/

     # 重要：把构建好的静态文件上传成 artifact，给后面的 deploy job 用
    - name: Upload site artifact
      id: upload-artifact
      uses: actions/upload-artifact@v4
      with:
        name: site-public
        path: public
        retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest    # 这里改用 GitHub 自托管的 runner（网络直连 GitHub）

    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: site-public
          path: public

      - name: Deploy to gh-pages
        id: deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.PERSONAL_TOKEN }}
          publish_branch: gh-pages
          publish_dir: public
          force_orphan: true
