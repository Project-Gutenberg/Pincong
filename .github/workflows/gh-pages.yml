name: github pages


on:
 schedule:
  - cron: "0 18 */8 * *"
 push:
   branches:
   - main
permissions:
  contents: write

concurrency:
  group: gh-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-hugo:
    runs-on: [ubicloud-standard-16] #self-hosted
    steps:
    - name: Init
      run: |
          echo "::add-mask::${{ secrets.PATH_HFFIN }}"
          echo "::add-mask::${{ secrets.PATH_HFEEF }}"
          echo "::add-mask::${{ secrets.PATH_HFFIE }}"
          echo "::add-mask::${{ secrets.PATH_FEDGE }}"
          echo "::add-mask::${{ secrets.MACHINE }}"

    - uses: actions/checkout@v4
      with:
        repository: Project-Gutenberg/Pincong-data

    # 仅用于诊断：查看当前 repo 的对象库大小（包含 size-pack）
    - name: Log git object store size
      shell: bash
      run: |
        echo "==== git count-objects -Hv ===="
        git count-objects -Hv
        echo "==== size-pack only ===="
        git count-objects -Hv | sed -n 's/^size-pack: //p'

    - name: Process tags
      run: chmod +x ./main && ./main tag

    - name: Setup Hugo
      uses: peaceiris/actions-hugo@v2
      with:
        hugo-version: '0.100.2'
        extended: true

    - name: Cache Hugo resources
      uses: ubicloud/cache@v4
      with:
        path: |
          site/resources
        key: ${{ runner.os }}-hugo-${{ hashFiles('github.toml', 'base.toml', 'site/**') }}
        restore-keys: |
          ${{ runner.os }}-hugo-

    - name: Build Hogo
      run: hugo --minify --config github.toml,base.toml -d ../public -s site

    - name: Split Sitemap
      run: ./main sitemap ./public/

    - name: Deploy
      continue-on-error: true
      id: deploy
      uses: peaceiris/actions-gh-pages@v4
      with:
        personal_token: ${{ secrets.PERSONAL_TOKEN }}
        publish_branch: gh-pages
        publish_dir: public
        force_orphan: true   # 关键：每次部署都从一个全新的 orphan 分支开始
